[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-eval-harness"
version = "0.1.0"
description = "A small, inspectable harness for comparing language models with rubric-based judging."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JR Ignacio" }]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.68"]
anthropic = ["anthropic>=0.49"]
gemini = ["google-genai>=1.0"]
typesafe = ["typesafe-sdk"]
all = ["openai>=1.68", "anthropic>=0.49", "google-genai>=1.0", "typesafe-sdk"]
dev = ["pytest>=8.0", "ruff>=0.11"]

[project.scripts]
eval-harness = "eval_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
